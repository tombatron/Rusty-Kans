{% extends "base.html" %}

{% import "macros.html" as macros %}

{% block content %}
{{ macros::add_new_container_form(new_board) }}

<div id="boards" class="boards-grid">
    {% for board in boards %}
    {{ macros::board_item(board.id, board.name) }}
    {% endfor %}
</div>
{% endblock %}

{% block bottom_scripts %}
<script>
    document.addEventListener('input', e => {
        if (!e.target.matches('[id^="delete-input-"]')) return;
        const boardId = e.target.id.replace('delete-input-', '');
        const btn = document.getElementById(`delete-confirm-${boardId}`);
        const expected = document.querySelector(`#delete-dialog-${boardId} strong`).textContent;
        btn.disabled = e.target.value !== expected;
    });
</script>
{% endblock %}
