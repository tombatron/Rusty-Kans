{% import "macros.html" as macros %}
<turbo-stream action="append" target="lists">
    <template>
        <div class="list">
            <h3 class="list-title">{{ name }}</h3>
            <ul id="list-cards-{{ id }}" data-controller="card-list" data-card-list-list-id-value="{{ id }}"></ul>
            {{ macros::add_card(id) }}
        </div>
    </template>
</turbo-stream>
