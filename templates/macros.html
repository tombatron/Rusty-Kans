{% macro list_item(card:Card) %}
<li id="card-{{ card.id }}" data-card-id="{{ card.id }}">
    <h4>{{ card.title }}</h4>
    <span class="badge badge-{{ card.status|lower }}">{{ card.status }}</span>
    {% if let Some(desc) = card.description %}
    <p>{{ desc }}</p>
    {% else %}
    <p class="no-desc">No description.</p>
    {% endif %}
</li>
{% endmacro %}

{% macro add_card(list_id) %}
<div class="add-card">
    <form action="/lists/{{ list_id }}/cards" method="post">
        <input type="text" name="title" placeholder="Card title&hellip;" required>
        <div class="add-card-actions">
            <button type="submit">Add</button>
        </div>
    </form>
</div>
{% endmacro %}
