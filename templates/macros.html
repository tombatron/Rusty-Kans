{% macro list_item(card:Card) %}
<template>
    <li id="card-{{ card.id }}" data-card-id="{{ card.id }}">
        <h4>{{ card.title }}</h4>
        <span class="badge badge-{{ card.status|lower }}">{{ card.status }}</span>
        {% if let Some(desc) = card.description %}
        <p>{{ desc }}</p>
        {% else %}
        <p class="no-desc">No description.</p>
        {% endif %}
    </li>
</template>
{% endmacro %}
